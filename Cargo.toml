[package]
name = "hikyaku"
version = "0.1.0"
edition = "2024"
description = "Node agent of the observability stack: scrapes, logs, durable spool, push"

# Direct dependencies are limited to ADR 0002.
[dependencies]
prost = "0.13"
# ureq's TLS backend, used directly for the pinned CA (ADR 0006); PEM parsing comes from
# its pki-types (`rustls::pki_types::pem`), the successor of rustls-pemfile.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["tls"] }
zstd = "0.13"

[build-dependencies]
prost-build = "0.13"
